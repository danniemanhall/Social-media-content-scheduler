name = "roopip-content-calendar"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"

# Shared calendar storage in the Roopip Cloudflare account (created 17 Nov 2026, schema applied). To recreate:
#   npx wrangler d1 create roopip-calendar
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "roopip-calendar"
database_id = "9fe1bca5-d54d-4e43-bf03-262cbb32a9b0"
migrations_dir = "migrations"

# Phase 4: files waiting to be posted. Meta fetches them from the public r2.dev URL;
# the publisher deletes them once posted, and a bucket rule deletes anything older than 3 days.
[[r2_buckets]]
binding = "OUTBOX"
bucket_name = "roopip-outbox"

[vars]
OUTBOX_PUBLIC_URL = "https://pub-d5c113d93d654a2b8144da66e2de900e.r2.dev"
GOOGLE_CLIENT_ID = "826846003906-dk4t0p6be391dnsdtg1v62mjnb6o23os.apps.googleusercontent.com"
