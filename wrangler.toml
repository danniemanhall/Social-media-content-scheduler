name = "roopip-content-calendar"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"

# Shared calendar storage in the Roopip Cloudflare account (created 17 Nov 2026, schema applied). To recreate:
#   npx wrangler d1 create roopip-calendar
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "roopip-calendar"
database_id = "9fe1bca5-d54d-4e43-bf03-262cbb32a9b0"
migrations_dir = "migrations"

# Phase 4: the R2 outbox binding (OUTBOX) and its public URL (OUTBOX_PUBLIC_URL)
# are added here once R2 is enabled on the Roopip account. See docs/meta-setup.md.
